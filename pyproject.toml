[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wadiline-booking"
version = "1.0.0"
description = "Wadiline's booking service: trips, seats, fares, refunds and the booking API."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = ["fastapi>=0.114,<0.115", "uvicorn>=0.30,<0.31", "tzdata>=2024.1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<0.28", "ruff>=0.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
