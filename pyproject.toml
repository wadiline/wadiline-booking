[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wadiline-booking"
version = "0.1.0"
description = "Wadiline's booking service: trips, seats, fares and refunds."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9", "ruff>=0.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
